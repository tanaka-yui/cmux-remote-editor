# HTTP: permanent redirect to the HTTPS port. $request_uri keeps the query
# string, so existing bookmarks with ?token=... land on https with the token.
server {
  listen 80;
  server_name _;
  return 301 https://$host:48710$request_uri;
}

# HTTPS. Certs come from mkcert (`pnpm certs:setup`) via the compose volume
# mount — they are not baked into the image. No `http2 on` here: nginx cannot
# proxy WebSocket over HTTP/2, and /ws is the app's lifeline, so the listener
# stays on HTTP/1.1.
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate     /etc/nginx/certs/server.pem;
  ssl_certificate_key /etc/nginx/certs/server-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  index index.html;

  # The host-side Bun bridge terminates TLS too (CMUX_REMOTE_TLS), so this hop is
  # encrypted end-to-end — no plaintext token / terminal I/O on the wire. The
  # mkcert leaf has no `host.docker.internal` SAN, and this is a host-internal hop
  # (MITM would require root on the Mac), so upstream cert verification is off:
  # we want confidentiality, not upstream identity checks.
  #
  # WebSocket bridge to the host-side Bun server (started with `pnpm server:up`).
  location /ws {
    proxy_pass https://host.docker.internal:48701;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Health check passthrough.
  location /health {
    proxy_pass https://host.docker.internal:48701;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
  }

  # Web Push subscription endpoints (/push/vapid-public-key, /push/subscribe,
  # /push/unsubscribe) → host-side Bun server. Without this they fall through to
  # the SPA fallback below and return index.html, so the client's res.json() fails.
  # nginx forwards the client's Authorization: Bearer header to the upstream by default.
  location /push/ {
    proxy_pass https://host.docker.internal:48701;
    proxy_ssl_verify off;
    proxy_set_header Host $host;
  }

  # SPA fallback for client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
